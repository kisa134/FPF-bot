name: FPF Orchestrator

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: "Reasoning task for the agent"
        required: true
        default: "Choose the primary datastore for a new service"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pydantic>=2,<3" fastapi httpx
      - name: Run the test suite
        run: python -m unittest discover -s v1/tests -p 'test_*.py' -v

  run:
    # Live reasoning run — on manual dispatch AND on push (key is in the repo).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pydantic>=2,<3" openai
      - name: Show available WaveSpeed model ids (for tuning DEFAULT_MODELS)
        continue-on-error: true
        run: |
          KEY=$(python -c "from v1.policy._secret import WAVESPEED_API_KEY as k; print(k)")
          curl -sS https://llm.wavespeed.ai/v1/models \
            -H "Authorization: Bearer $KEY" | head -c 6000 || true
      - name: Run the reasoning loop
        run: |
          python -m v1 run "${{ github.event.inputs.task || 'Choose the primary datastore for a high-write telemetry service' }}" --memory ./fpf-memory
      - name: Upload the reasoning trace (memory)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpf-memory
          path: fpf-memory
